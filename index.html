<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life Hub">
  <title>Life Hub</title>

  <link rel="manifest" href="/lifehub-pwa/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/lifehub-pwa/apple-touch-icon.png?v=2">

  <style>
    :root {
      --primary: #D8AAA5;
      --primary-strong: #9F7470;
      --primary-soft: rgba(216, 170, 165, .16);
      --primary-pale: #F6EFEB;
      --background: #FAF8F7;
      --card: #FFFFFF;
      --card-strong: #FFFFFF;
      --text: #3F3836;
      --text-muted: #998B87;
      --border: rgba(153, 139, 135, .14);
      --success: #6E8174;
      --success-soft: #EEF3EF;
      --warning: #98765E;
      --warning-soft: #F5EEE8;
      --danger: #A06561;
      --danger-soft: #F7ECEA;
      --on-primary: #FFFFFF;
      --navigation-background: rgba(255, 255, 255, .97);
      --navigation-border: rgba(153, 139, 135, .14);
      --navigation-shadow: rgba(63, 56, 54, .035);
      --shadow-card: 0 12px 36px rgba(63, 56, 54, .055);
      --radius-card: 22px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body { overscroll-behavior-y: none; }
    button, a { font: inherit; color: inherit; }
    button { color: inherit; }
    b, strong { font-weight: 600; }
    [hidden] { display: none !important; }

    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: calc(92px + var(--safe-bottom));
      background: var(--background);
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 18px 32px;
    }

    .eyebrow {
      margin: 0;
      color: var(--primary);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .summary-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .pressable {
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .pressable:active {
      transform: scale(.98);
      filter: brightness(.985);
    }

    .icon-library {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .ui-icon {
      display: block;
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: calc(22px + var(--safe-top)) 18px 18px;
      background: var(--background);
    }

    .header-title {
      min-width: 0;
      flex: 1;
      text-align: left;
    }

    .header-title h1 {
      overflow: hidden;
      margin: 7px 0 0;
      font-size: 25px;
      font-weight: 650;
      line-height: 1.16;
      letter-spacing: -.045em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-period {
      min-height: 1em;
      margin: 7px 0 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .header-action {
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(255, 255, 255, .90);
      box-shadow: 0 7px 22px rgba(63, 56, 54, .04);
      color: var(--primary-strong);
      text-decoration: none;
    }

    .header-action .ui-icon {
      width: 19px;
      height: 19px;
    }

    .home-header-spacer {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
    }

    .bottom-navigation {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(430px, 100%);
      height: calc(76px + var(--safe-bottom));
      padding: 0 0 var(--safe-bottom);
      transform: translateX(-50%);
      border-top: 1px solid var(--navigation-border);
      background: var(--navigation-background);
      box-shadow: 0 -7px 24px var(--navigation-shadow);
      backdrop-filter: blur(18px);
    }

    .navigation-item {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      border: 0;
      background: transparent;
      color: #A09490;
      text-decoration: none;
    }

    .navigation-item .ui-icon {
      width: 21px;
      height: 21px;
    }

    .navigation-item small {
      font-size: 9px;
      font-weight: 500;
    }

    .navigation-item.is-active {
      color: var(--primary-strong);
    }

    .navigation-item.is-active .ui-icon {
      stroke-width: 2;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 3px 10px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .section-note {
      color: var(--text-muted);
      font-size: 10px;
    }

    .live-badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--warning-soft);
      color: var(--warning);
      font-size: 9px;
      font-weight: 500;
    }

    .home-page { gap: 12px; }

    .welcome-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 136px;
      padding: 20px 19px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: var(--radius-card);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }

    .welcome-copy { min-width: 0; }

    .welcome-card h2 {
      margin: 10px 0 7px;
      font-size: 25px;
      font-weight: 650;
      line-height: 1.15;
      letter-spacing: -.045em;
    }

    .welcome-card p:last-child {
      margin: 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .welcome-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border-radius: 14px;
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    .welcome-mark .ui-icon {
      width: 22px;
      height: 22px;
    }

    .home-section-heading { margin-top: 8px; }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-card {
      display: flex;
      min-width: 0;
      min-height: 132px;
      padding: 17px 15px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: var(--radius-card);
      background: var(--card);
      box-shadow: var(--shadow-card);
      color: inherit;
      flex-direction: column;
      text-decoration: none;
    }

    .summary-card__top {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .summary-icon {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    .summary-icon .ui-icon {
      width: 17px;
      height: 17px;
    }

    .summary-card strong {
      margin: 17px 0 6px;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .summary-card small {
      display: block;
      color: var(--text-muted);
      font-size: 9px;
      line-height: 1.5;
      white-space: normal;
    }

    .summary-card.is-over-budget .summary-icon {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .summary-card.is-over-budget strong {
      color: var(--danger);
    }

    .character-card {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border-radius: var(--radius-card);
      background: #F8F3EF;
      border: 1px solid rgba(152,118,94,.10);
      box-shadow: none;
      color: var(--text);
    }

    .character-card h3 {
      margin: 0 0 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .character-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .character-title .ui-icon {
      width: 17px;
      height: 17px;
      color: var(--warning);
    }

    .character-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .fp-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 17px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: var(--radius-card);
      background: var(--card);
      box-shadow: var(--shadow-card);
      color: inherit;
      text-decoration: none;
    }

    .fp-status-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    .fp-status-icon .ui-icon {
      width: 19px;
      height: 19px;
    }

    .fp-card-content {
      min-width: 0;
      flex: 1;
    }

    .fp-card-content strong {
      display: block;
      margin: 5px 0 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .fp-card-content p {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .fp-chevron {
      color: var(--text-muted);
    }

    .fp-chevron .ui-icon {
      width: 18px;
      height: 18px;
    }

    .future-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .future-card {
      appearance: none;
      width: 100%;
      margin: 0;
      padding: 13px 8px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #FCF9F7;
      color: inherit;
      font: inherit;
      text-align: center;
      cursor: pointer;
    }

    .future-card span {
      display: grid;
      place-items: center;
    }

    .future-icon {
      width: 34px;
      height: 34px;
      margin: 0 auto 8px;
      border-radius: 11px;
      background: var(--primary-soft);
      color: var(--primary-strong);
    }

    .future-icon .ui-icon {
      width: 18px;
      height: 18px;
    }

    .future-card strong {
      display: block;
      margin: 6px 0 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .future-card small {
      display: block;
      color: var(--text-muted);
      font-size: 8px;
      line-height: 1.45;
    }

    .future-card.is-active {
      border-color: rgba(159,116,112,.16);
      background: var(--card);
      box-shadow: var(--shadow-card);
    }

    .future-card.is-active small {
      color: var(--primary-strong);
      font-weight: 600;
    }

    .loading-card, .error-card {
      padding: 38px 20px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: var(--radius-card);
      background: var(--card);
      box-shadow: var(--shadow-card);
      color: var(--text-muted);
      font-size: 11px;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #EADFD9;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #lifehub-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      background: #FAF8F7;
      transition: opacity .22s ease;
    }

    #lifehub-boot.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lifehub-boot-card {
      text-align: center;
      color: #3F3836;
    }

    .lifehub-boot-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.04em;
      box-shadow: 0 14px 40px rgba(63, 56, 54, .08);
    }

    .lifehub-boot-title {
      font-size: 16px;
      font-weight: 600;
    }

    .lifehub-boot-sub {
      margin-top: 7px;
      font-size: 11px;
      color: #998B87;
    }

    @media (max-width: 360px) {
      .summary-grid { grid-template-columns: 1fr; }
      .future-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="lifehub-boot" aria-hidden="true">
    <div class="lifehub-boot-card">
      <div class="lifehub-boot-mark">LH</div>
      <div class="lifehub-boot-title">Life Hub</div>
      <div class="lifehub-boot-sub">暮らしを読み込んでいます</div>
    </div>
  </div>

  <svg class="icon-library" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M9 21v-7h6v7"/></symbol>
    <symbol id="icon-threads" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 13c.8-3 6.6-3 7.4-.1.7 2.6-2.4 4.5-4.8 3.5-2.1-.9-1.6-3.7.7-4.1 3.1-.6 5.8.9 6.7 3.4"/></symbol>

  </svg>

  <div class="app-shell">
    <header class="app-header">
      <span class="home-header-spacer" aria-hidden="true"></span>

      <div class="header-title">
        <p class="eyebrow">LIFE HUB</p>
        <h1>Life Hub</h1>
        <p class="header-period">今日の暮らし</p>
      </div>

      <button class="header-action pressable" id="header-refresh" type="button" aria-label="最新情報に更新">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
      </button>
    </header>

    <main class="main-content home-page">
      <section class="welcome-card" aria-labelledby="greeting">
        <div class="welcome-copy">
          <p class="eyebrow" id="home-date">LIFE HUB</p>
          <h2 id="greeting">読み込み中...</h2>
          <p>今日やることを、ここから。</p>
        </div>

        <span class="welcome-mark" aria-hidden="true">
          <svg class="ui-icon"><use href="#icon-leaf"></use></svg>
        </span>
      </section>

      <div class="section-heading home-section-heading">
        <h2>今日</h2>
        <span class="section-note">暮らしの現在地</span>
      </div>

      <section class="summary-grid" aria-label="今日の概要">
        <a class="summary-card pressable" href="/lifehub-pwa/threads.html">
          <span class="summary-card__top">
            <span class="summary-icon">
              <svg class="ui-icon"><use href="#icon-threads"></use></svg>
            </span>
            <span class="summary-label">今日の投稿</span>
          </span>

          <strong id="home-post-count">—</strong>
          <small id="home-post-detail">確認中</small>
        </a>

        <a class="summary-card pressable" id="home-budget-card" href="#" data-external="?page=budget">
          <span class="summary-card__top">
            <span class="summary-icon">
              <svg class="ui-icon"><use href="#icon-wallet"></use></svg>
            </span>
            <span class="summary-label" id="home-budget-label">今月の予算</span>
          </span>

          <strong id="home-budget">—</strong>
          <small id="home-today-budget">確認中</small>
        </a>
      </section>

      <section id="home-character-section" hidden>
        <div class="section-heading">
          <h2>キャラ速報</h2>
          <span class="live-badge">NEW</span>
        </div>

        <article class="character-card pressable" id="home-character-card"></article>
      </section>

      <section>
        <div class="section-heading">
          <h2>お金</h2>
          <span class="section-note">HICHI FP＋</span>
        </div>

        <a

        >

            <p id="home-fp-comment">ひちFP＋を確認します。</p>
          </div>

          <span class="fp-chevron">
            <svg class="ui-icon"><use href="#icon-chevron-right"></use></svg>
          </span>
        </a>
      </section>

      <section>
        <div class="section-heading">
          <h2>便利ツール</h2>
          <span class="section-note">Life Hub</span>
        </div>

        <div class="future-grid" id="home-future-modules">
          <div class="loading-card">
            <span class="spinner"></span>
            <p>読み込んでいます</p>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-navigation" aria-label="メインナビゲーション">
      <a class="navigation-item pressable is-active" href="/lifehub-pwa/">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-home"></use></svg>
        <small>HOME</small>
      </a>

      <a class="navigation-item pressable" href="/lifehub-pwa/threads.html">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-threads"></use></svg>
        <small>Threads</small>
      </a>

      <a class="navigation-item pressable" href="#" data-external="?page=budget">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-wallet"></use></svg>
        <small>家計簿</small>
      </a>

      <a
        class="navigation-item pressable"
        href="#"
        data-url="https://script.google.com/macros/s/AKfycbzqVn_XCdqtbGMrfYdqVAkdJXVKi08fIaz8EHbvg3cfu5qFdokVfa8FyLEzzDwKdwPk3g/exec"
      >
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-chart"></use></svg>
        <small>FP</small>

    </nav>
  </div>

  <script>
    const GAS_APP = 'https://script.google.com/macros/s/AKfycbz0w5PVLXCBEXDfdo4aLvwT1vlLmrLMKPkXiRW3ppRd55ANnpOfEQgkLLU7YinTRg0J/exec';
    let timeoutId = null;

    function fmtYen(value) {
      return Math.round(Number(value) || 0).toLocaleString('ja-JP') + '円';
    }

    function gasUrl(value) {
      const href = String(value || '').trim();
      if (!href) return '';
      if (/^https?:\/\//i.test(href)) return href;
      if (href.startsWith('?')) return GAS_APP + href;
      return GAS_APP + '?' + href;
    }

    function openExternal(url) {
      if (!url) return;
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function finishBoot() {
      const boot = document.getElementById('lifehub-boot');
      if (!boot) return;
      boot.classList.add('is-hidden');
      setTimeout(() => boot.remove(), 250);
    }

    function iconName(name) {
      if (name === 'receipt') return 'receipt';
      if (name === 'cart') return 'package';
      if (name === 'checklist') return 'check';
      return 'circle';
    }

    function renderCharacter(post) {
      const section = document.getElementById('home-character-section');
      const card = document.getElementById('home-character-card');
      section.hidden = !post;
      card.replaceChildren();

      if (!post) return;

      const title = document.createElement('h3');
      title.className = 'character-title';
      title.innerHTML = '<svg class="ui-icon"><use href="#icon-flame"></use></svg><span></span>';
      title.querySelector('span').textContent = post.title || 'キャラ速報';

      const body = document.createElement('p');
      body.textContent = post.body || '';

      card.append(title, body);
    }

    function renderFutureModules(modules) {
      const area = document.getElementById('home-future-modules');
      area.replaceChildren();

      (modules || []).forEach(module => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'future-card pressable is-active';

        const iconWrap = document.createElement('span');
        iconWrap.className = 'future-icon';
        iconWrap.innerHTML = '<svg class="ui-icon"><use href="#icon-' + iconName(module.icon) + '"></use></svg>';

        const title = document.createElement('strong');
        title.textContent = module.title || '';

        const sub = document.createElement('small');
        sub.textContent = module.subtitle || '';

        card.append(iconWrap, title, sub);

        const url = gasUrl(module.href);
        if (url) card.addEventListener('click', () => openExternal(url));

        area.appendChild(card);
      });
    }

    function renderHome(response) {
      clearTimeout(timeoutId);

      if (!response || !response.ok) {
        document.getElementById('home-future-modules').innerHTML =
          '<div class="error-card">データを取得できませんでした。</div>';
        finishBoot();
        return;
      }

      const data = response.data || {};

      document.getElementById('home-date').textContent =
        data.displayDate ? data.displayDate + ' · LIFE HUB' : 'LIFE HUB';

      document.getElementById('greeting').textContent =
        data.greeting || 'こんにちは';

      const threads = data.threads || {};
      document.getElementById('home-post-count').textContent =
        (threads.total ?? 0) + '件';

      document.getElementById('home-post-detail').textContent =
        '準備OK ' + (threads.ready ?? 0) + '件・投稿済み ' + (threads.posted ?? 0) + '件';

      const budget = data.budget || {};
      const remaining = budget.remaining == null ? null : Number(budget.remaining);
      const today = budget.today == null ? null : Number(budget.today);
      const budgetCard = document.getElementById('home-budget-card');

      budgetCard.classList.remove('is-over-budget');

      if (remaining == null || !Number.isFinite(remaining)) {
        document.getElementById('home-budget-label').textContent = '今月の予算';
        document.getElementById('home-budget').textContent = '—';
        document.getElementById('home-today-budget').textContent = '家計簿を確認';
      } else if (remaining < 0) {
        budgetCard.classList.add('is-over-budget');
        document.getElementById('home-budget-label').textContent = '予算オーバー';
        document.getElementById('home-budget').textContent = fmtYen(Math.abs(remaining));
        document.getElementById('home-today-budget').textContent =
          Number.isFinite(today) ? '今日の目安 ' + fmtYen(today) : '家計簿を確認';
      } else {
        document.getElementById('home-budget-label').textContent = 'あと使える';
        document.getElementById('home-budget').textContent = fmtYen(remaining);
        document.getElementById('home-today-budget').textContent =
          Number.isFinite(today) ? '今日の目安 ' + fmtYen(today) : '家計簿を確認';
      }

      const fp = data.fp || {};
      document.getElementById('home-fp-status').textContent =
        fp.status || '確認中';
      document.getElementById('home-fp-comment').textContent =
        fp.comment || 'ひちFP＋を確認します。';

      renderCharacter(data.characterPost);
      renderFutureModules(data.upcomingModules);

      finishBoot();
    }

    window.lifeHubHomeCallback = renderHome;

    function loadHome() {
      const old = document.getElementById('lifehub-home-api');
      if (old) old.remove();

      const script = document.createElement('script');
      script.id = 'lifehub-home-api';
      script.src =
        GAS_APP +
        '?api=v1/home/dashboard&callback=lifeHubHomeCallback&_=' +
        Date.now();

      script.onerror = () => {
        clearTimeout(timeoutId);
        document.getElementById('home-future-modules').innerHTML =
          '<div class="error-card">Life Hubを読み込めませんでした。</div>';
        finishBoot();
      };

      document.head.appendChild(script);

      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        document.getElementById('home-future-modules').innerHTML =
          '<div class="error-card">読み込みに時間がかかっています。</div>';
        finishBoot();
      }, 10000);
    }

    document.getElementById('header-refresh').addEventListener('click', loadHome);

    document.querySelectorAll('[data-external]').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        openExternal(gasUrl(link.dataset.external));
      });
    });

    document.querySelectorAll('[data-url]').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        openExternal(link.dataset.url);
      });
    });

    loadHome();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/lifehub-pwa/sw.js', { scope: '/lifehub-pwa/' })
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
