<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life Hub">
  <title>Life Hub</title>
  <link rel="manifest" href="/lifehub-pwa/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/lifehub-pwa/apple-touch-icon.png">
  <style>
    :root { --bg:#FAF8F7; --ink:#3F3836; --muted:#998B87; --accent:#D8AAA5; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); }
    body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif; }
    #lifehub-frame { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
    #boot { position:fixed; inset:0; z-index:2; display:grid; place-items:center; background:var(--bg); color:var(--muted); transition:opacity .18s ease; }
    #boot.hidden { opacity:0; pointer-events:none; }
    .boot-card { text-align:center; padding:24px; }
    .mark { width:52px; height:52px; margin:0 auto 13px; display:grid; place-items:center; border-radius:17px; background:#fff; color:var(--ink); box-shadow:0 12px 36px rgba(63,56,54,.055); font-weight:700; letter-spacing:-.04em; }
    .boot-title { font-size:15px; font-weight:600; color:var(--ink); }
    .boot-sub { margin-top:6px; font-size:10px; }
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">
    <div class="boot-card">
      <div class="mark">LH</div>
      <div class="boot-title">Life Hub</div>
      <div class="boot-sub">暮らしを読み込んでいます</div>
    </div>
  </div>

  <iframe
    id="lifehub-frame"
    title="Life Hub"
    src="https://script.google.com/macros/s/AKfycbz0w5PVLXCBEXDfdo4aLvwT1vlLmrLMKPkXiRW3ppRd55ANnpOfEQgkLLU7YinTRg0J/exec?page=home">
  </iframe>

  <script>
    const frame = document.getElementById('lifehub-frame');
    const boot = document.getElementById('boot');
    frame.addEventListener('load', () => boot.classList.add('hidden'));
    setTimeout(() => boot.classList.add('hidden'), 5000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/lifehub-pwa/sw.js', { scope: '/lifehub-pwa/' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
