<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F7">
<title>Life Hub インストール</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#FAF8F7;color:#3F3836;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
  main{width:min(90vw,420px);text-align:center}
  img{width:92px;height:92px;border-radius:24px;box-shadow:0 14px 36px rgba(63,56,54,.08)}
  h1{font-size:24px;margin:22px 0 8px}
  p{font-size:14px;line-height:1.7;color:#766A67;margin:0 0 22px}
  .button{display:block;width:100%;border:0;border-radius:16px;padding:16px;background:#3F3836;color:#fff;font-size:16px;font-weight:700;text-decoration:none}
  small{display:block;margin-top:14px;color:#998B87;line-height:1.6}
</style>
</head>
<body>
<main>
  <img src="./apple-touch-icon.png" alt="Life Hub">
  <h1>Life Hub</h1>
  <p>iPhoneのホーム画面に、Life Hub専用アイコンを追加します。</p>
  <a class="button" href="./LifeHub.mobileconfig">Life Hubをインストール</a>
  <small>Safariでこのページを開いてボタンを押してください。<br>プロファイルがダウンロードされたら「設定」→「プロファイルがダウンロード済み」→「Life Hub」→「インストール」です。</small>
</main>
</body>
</html>
